[platformio]
default_envs = esp32dev_standalone

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = ota_nofs_4MB.csv
lib_deps =
  chris--a/Keypad@^3.1.1
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  madhephaestus/ESP32Servo@^3.0.5

[env:esp32dev_standalone]
build_flags =
  -D SERVO_TEST_BUILD=0

[env:esp32dev_supervised_servo_test]
build_flags =
  -D SERVO_TEST_BUILD=1
