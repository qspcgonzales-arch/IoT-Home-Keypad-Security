[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  chris--a/Keypad
  marcoschwartz/LiquidCrystal_I2C
  arduino-libraries/Servo
  bblanchon/ArduinoJson@^7.0.0
  rweather/Crypto
  ${sysenv.USERPROFILE}/.platformio/packages/framework-arduino-avr/libraries/SoftwareSerial
